services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - september_fit_redisdata:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: september_fit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - september_fit_pgdata:/var/lib/postgresql/data

volumes:
  september_fit_pgdata:
  september_fit_redisdata:
